server:
  port: ${PORT:8085}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,image/svg+xml
  tomcat:
    max-threads: 200
    accept-count: 100

spring:
  application:
    name: settlex
  main:
    banner-mode: console
  mvc:
    problemdetails:
      enabled: false
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: true
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          max-age: 3600
          must-revalidate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    diskspace:
      enabled: false
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: settlex

info:
  app:
    name: SettleX
    description: Algorithmic Multi-Party Debt Optimization Engine
    version: 1.0.0

logging:
  level:
    root: INFO
    com.settlex: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

settlex:
  engine:
    # Maximum number of participants for which the exact NP-hard bitmask
    # zero-sum partition solver is attempted. 2^16 states are tractable in-memory.
    exact-solver-max-participants: 16
  benchmark:
    # Dedicated pool so /benchmark can genuinely run both engines concurrently.
    core-pool-size: 2
    max-pool-size: 8
    queue-capacity: 256
    timeout-ms: 30000